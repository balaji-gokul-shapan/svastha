  <!-- 8. Outer Convex Glass Cabochon Sheen -->
  <path d="M 35 60 C 45 35, 70 22, 100 22 C 130 22, 155 35, 165 60 C 140 46, 60 46, 35 60 Z" fill="#ffffff" opacity="0.15" />
